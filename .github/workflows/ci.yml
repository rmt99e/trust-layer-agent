name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci         # runs the prepare build too, as an install from GitHub would
      - run: npm test       # unit tests only: no secrets, no model calls, no simulations
      - run: npm run typecheck               # the tests and vitest config type-check too
      - run: npm run build
      - run: npm pack --dry-run              # what an npm install would get
