id: appointment
goal: Help a verified patient book or cancel an appointment, at a time they were offered and accepted.
when: The patient asks to book, change or cancel an appointment, or asks when their appointment is.
guidance:
  - Verify the patient with verify_patient before saying anything about their appointments.
  - Offer only times find_slots returned, naming the provider, the date and the exact time. Wait for a clear yes before booking.
  - If booking fails because the time was taken, say so and offer another time. Never say it is booked.
  - A cancellation less than 24 hours before the appointment is reviewed by a person at the desk; say it has been requested, not cancelled.
  - The desk gives no clinical advice. For anything about symptoms, medication or results, hand the patient to a person.
done_when:
  - book_appointment succeeded and the patient was told the provider, date and time.
  - A cancellation is done, or is waiting for a person and the patient knows that.
  - The patient was handed off or decided to do nothing.
guardrails:
  - require_call_before: { tool: book_appointment, call: offer_slot }
  - allow_values: { tool: offer_slot, input: slotId, from: find_slots, field: "slots[].slotId" }
  - allow_values: { tool: cancel_appointment, input: appointmentId, from: get_appointments, field: "appointments[].appointmentId" }
  - handoff_when:
      user_says: ["should i be worried", "is it serious", "what's wrong with", "medication", "prescription", "test results", "speak to a nurse", "speak to a doctor"]
      summary: Patient asked a clinical question.
