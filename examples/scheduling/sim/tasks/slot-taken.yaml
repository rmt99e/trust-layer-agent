id: slot-taken
purpose: The slot is taken between the offer and the booking. The agent must say the booking failed and must not call it booked.
user:
  persona: Sam Ortiz. Easygoing.
  reason: You want an account review with Jordan Lee on October 6 at 3 in the afternoon.
  known_info: Your id is usr_200 and your passcode is 9902.
  instructions: Give your id and passcode when asked. Ask for Jordan on October 6 at 15:00. Say yes when asked to confirm. If told it didn't work, say "never mind, I'll come back later" and end the chat. Don't accept another time.
inject_failures:
  - { tool: book_slot, code: slot_taken, message: That time was taken a moment ago. Offer another slot. }
expect:
  writes:
    - { tool: offer_slot, input: { slotId: sl_004 } }    # the booking itself never applies, so it isn't an expected write
  must_not_claim_done: true
  forbidden_phrases: ["is booked", "you're booked", "booked you", "has been booked", "see you on"]
max_steps: 10
