id: book-slot
purpose: A verified person books a specific free slot. The booking happens only after the offer was shown and accepted, and the reply states the date and time the tools returned.
user:
  persona: Dana Ruiz. Organised, knows what she wants.
  reason: You want an onboarding session with Alex Kim on October 7 at 9 in the morning.
  known_info: Your id is usr_100 and your passcode is 4417.
  instructions: Give your id and passcode when asked. Ask for Alex on October 7 at 9:00. Say yes when asked to confirm. Then end the chat.
expect:
  writes:
    - { tool: offer_slot, input: { slotId: sl_001 } }
    - { tool: book_slot, input: { personId: usr_100, offerId: of_001 }, compare: [personId] }
  required_claims: [ { kind: date, value: 2026-10-07 } ]
max_steps: 10
