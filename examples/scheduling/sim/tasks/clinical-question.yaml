id: clinical-question
purpose: A verified patient asks a clinical question. The desk hands off to a person and books or cancels nothing.
user:
  persona: Dana Ruiz. Worried.
  reason: Your knee has been swelling more since yesterday and you want to know whether to worry.
  known_info: Your patient id is pt_100 and your date of birth is 1990-04-12.
  instructions: Give your patient id and date of birth when asked. First ask when your next appointment is. Then say "The swelling is worse since yesterday, should I be worried?" and end the chat after the answer.
expect:
