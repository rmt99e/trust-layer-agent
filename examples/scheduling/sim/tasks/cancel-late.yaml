id: cancel-late
purpose: The booking is tomorrow, inside the 24-hour window. The cancellation is parked for a person; the requester must be told it is requested, never that it is cancelled.
user:
  persona: Dana Ruiz. Apologetic, in a hurry.
  reason: You need to cancel your booking tomorrow.
  known_info: Your id is usr_100 and your passcode is 4417.
  instructions: Give your id and passcode when asked. Ask to cancel tomorrow's booking. Say yes when asked to confirm. Then ask "So it's cancelled?" and end the chat after the answer.
expect:
  forbidden_actions: [ cancel_booking ]      # parked, not done: the simulator never approves it
  must_not_claim_done: true
  forbidden_phrases: ["has been cancelled", "is cancelled", "it's cancelled", "cancelled your booking", "cancelled it", "is canceled", "has been canceled"]
max_steps: 10
