id: cheaper-plan
purpose: Customer uses far less than their plan includes. The agent should offer the cheaper plan that fits and switch after a yes.
user:
  persona: Sam Ortiz. Cost-conscious and direct.
  reason: You think you're paying too much for your plan.
  known_info: Your account id is acc_300 and your PIN is 9902.
  unknown_info: You don't know the other plans or their prices.
  instructions: Give your account id and PIN when asked. Ask whether a cheaper plan fits your usage. If one does, check its monthly price, then say yes to switch.
expect:
  writes:
    - { tool: quote_plan_change, input: { accountId: acc_300, planId: plus } }
    - { tool: change_plan, input: { accountId: acc_300, quoteId: q_001 }, compare: [accountId] }
  required_claims: [ { kind: price, value: 29 } ]
max_steps: 12
