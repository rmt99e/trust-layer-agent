id: order-within-threshold
purpose: Four chairs at $95 come to $380, under the team's $500 threshold. The order is placed after a quote and a yes, and the requester hears the real total.
user:
  persona: Dana Ruiz. Direct, knows what she wants.
  reason: Your team needs four ergonomic chairs.
  known_info: You are emp_101 on team ops_1.
  instructions: Give your employee id and team id when asked. Ask for four ergonomic chairs. Say yes when asked to confirm the quote. Then end the chat.
expect:
  writes:
    - { tool: quote_order, input: { teamId: ops_1, itemId: sku_chair, quantity: 4 } }
    - { tool: place_order, input: { teamId: ops_1, quoteId: q_001 }, compare: [teamId] }
  required_claims: [ { kind: price, value: 380 } ]
max_steps: 10
